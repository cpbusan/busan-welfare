<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부산형 고령장애인통합돌봄체계 구축사업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F3F6F9;
    --card:#FFFFFF;
    --ink:#2B3440;
    --ink-soft:#6B7686;
    --salmon:#4FA3D1;
    --salmon-deep:#2E7FB0;
    --sage:#8FA3AE;
    --line:#DCE4EA;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Pretendard',-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  header{
    padding:36px 20px 24px;
    text-align:center;
  }
  header .eyebrow{
    font-size:13px;
    color:var(--salmon-deep);
    font-weight:600;
    letter-spacing:0.5px;
  }
  header h1{
    font-size:26px;
    margin:6px 0 4px;
    font-weight:800;
  }
  header p{
    color:var(--ink-soft);
    font-size:14px;
    margin:0;
  }
  .wrap{
    max-width:960px;
    margin:0 auto;
    padding:0 16px 60px;
  }
  .filter-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:20px;
  }
  .filter-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:14px;
  }
  @media (max-width:600px){
    .filter-row{grid-template-columns:1fr;}
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
    color:var(--ink);
  }
  .field select, .field input[type=number]{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    font-size:14px;
    background:#fff;
    font-family:inherit;
    color:var(--ink);
  }
  .chip-group{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .chip{
    border:1px solid var(--line);
    background:#fff;
    border-radius:999px;
    padding:6px 12px;
    font-size:13px;
    cursor:pointer;
    user-select:none;
    transition:all .15s;
    color:var(--ink-soft);
  }
  .chip.active{
    background:var(--salmon);
    color:#fff;
    border-color:var(--salmon);
    font-weight:600;
  }
  .filter-actions{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:6px;
  }
  .btn-search{
    background:var(--salmon);
    color:#fff;
    border:none;
    padding:9px 18px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-reset{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:9px 14px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
  }
  .result-count{
    font-size:14px;
    color:var(--ink-soft);
    margin:4px 2px 12px;
  }
  .result-count b{color:var(--salmon-deep);}
  .cards{
    display:grid;
    gap:12px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
    cursor:pointer;
    transition:transform .12s, box-shadow .12s;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(46,127,176,0.12);
  }
  .badge{
    display:inline-block;
    background:#E4F0F7;
    color:var(--salmon-deep);
    font-size:12px;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:8px;
    margin-right:6px;
  }
  .card h3{
    margin:0 0 4px;
    font-size:17px;
  }
  .card .agency{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .card .desc{
    font-size:14px;
    color:var(--ink);
    line-height:1.5;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .empty, .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .big{font-size:34px;margin-bottom:8px;}
  /* 모달 */
  .modal-bg{
    position:fixed;inset:0;
    background:rgba(61,44,41,0.4);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:50;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:#fff;
    border-radius:20px;
    max-width:480px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:26px;
  }
  .modal h2{margin:0 0 4px;font-size:20px;}
  .modal .agency{color:var(--ink-soft);font-size:14px;margin-bottom:14px;}
  .modal .row{margin-bottom:12px;}
  .modal .row .k{font-size:12px;color:var(--salmon-deep);font-weight:700;margin-bottom:3px;}
  .modal .row .v{font-size:14px;line-height:1.6;}
  .modal .row .v div{margin-bottom:2px;}
  .modal-close{
    display:block;
    margin-top:18px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:var(--salmon);
    color:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  footer{
    text-align:center;
    padding:20px;
    font-size:12px;
    color:var(--ink-soft);
  }
  footer a{color:var(--ink-soft);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">고령장애인의 건강한 일상을 지원하는</div>
  <h1>부산형 고령장애인통합돌봄체계 구축사업</h1>
  <p>조건을 선택하면 받을 수 있는 복지서비스를 바로 확인할 수 있어요</p>
</header>

<div class="wrap">

  <div class="filter-box">
    <div class="filter-row">
      <div class="field">
        <label>출생연도</label>
        <input type="number" id="f-birthyear" placeholder="예: 1958" min="1900" max="2026">
      </div>
      <div class="field">
        <label>거주 지역</label>
        <div style="display:flex; gap:6px;">
          <select id="f-gu" style="flex:1;"><option value="">구/군 선택</option></select>
          <select id="f-dong" style="flex:1;"><option value="">동 전체</option></select>
        </div>
        <div style="font-size:12px; color:var(--ink-soft); margin-top:5px;">선택하지 않으면 부산 전체 서비스를 검색해요</div>
      </div>
    </div>

    <div class="field" style="margin-bottom:14px;">
      <label>지원영역 <span style="font-weight:400; color:var(--ink-soft);">(중복 선택 가능)</span></label>
      <div class="chip-group" id="f-area"></div>
      <div style="font-size:12px; color:var(--ink-soft); margin-top:5px;">선택하지 않으면 전체 지원영역을 검색해요</div>
    </div>

    <div class="field" style="margin-bottom:14px;">
      <label>장애유형 <span style="font-weight:400; color:var(--ink-soft);">(중복 선택 가능)</span></label>
      <div class="chip-group" id="f-type"></div>
      <div style="font-size:12px; color:var(--ink-soft); margin-top:5px;">선택하지 않으면 전체 장애유형을 검색해요</div>
    </div>

    <div class="field" style="margin-bottom:14px;">
      <label>장애정도 <span style="font-weight:400; color:var(--ink-soft);">(중복 선택 가능)</span></label>
      <div class="chip-group" id="f-level"></div>
      <div style="font-size:12px; color:var(--ink-soft); margin-top:5px;">선택하지 않으면 전체 장애정도를 검색해요</div>
    </div>

    <div class="field" style="margin-bottom:14px;">
      <label>소득 수준 <span style="font-weight:400; color:var(--ink-soft);">(중복 선택 가능)</span></label>
      <div class="chip-group" id="f-income"></div>
      <div style="font-size:12px; color:var(--ink-soft); margin-top:5px;">선택하지 않으면 전체 소득수준을 검색해요</div>
    </div>

    <div class="field" style="margin-bottom:0;">
      <label>기관</label>
      <select id="f-agency"><option value="">전체 기관</option></select>
    </div>

    <div class="filter-actions">
      <button class="btn-search" id="btn-search">검색</button>
      <button class="btn-reset" id="btn-reset">조건 초기화</button>
    </div>
  </div>

  <div class="result-count" id="result-count"></div>
  <div id="list-area"><div class="loading">불러오는 중...</div></div>

</div>

<footer>부산형 고령장애인통합돌봄체계 구축사업 · <a href="admin.html">기관 관리자 로그인</a></footer>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-body"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ===== 옵션 정의 =====
const REGIONS = {
  "중구": ["중앙동","동광동","대청동","보수동","부평동","광복동","남포동","영주1동","영주2동"],
  "서구": ["동대신1동","동대신2동","동대신3동","서대신1동","서대신3동","서대신4동","부민동","아미동","초장동","충무동","남부민1동","남부민2동","암남동"],
  "동구": ["초량1동","초량2동","초량3동","초량6동","수정1동","수정2동","수정4동","수정5동","좌천동","범일1동","범일2동","범일5동"],
  "영도구": ["남항동","영선1동","영선2동","신선동","봉래1동","봉래2동","청학1동","청학2동","동삼1동","동삼2동","동삼3동"],
  "부산진구": ["부전1동","부전2동","연지동","초읍동","양정1동","양정2동","전포1동","전포2동","부암1동","부암3동","당감1동","당감2동","당감4동","가야1동","가야2동","개금1동","개금2동","개금3동","범천1동","범천2동"],
  "동래구": ["수민동","복산동","명륜동","온천1동","온천2동","온천3동","사직1동","사직2동","사직3동","안락1동","안락2동","명장1동","명장2동"],
  "남구": ["대연1동","대연3동","대연4동","대연5동","대연6동","용호1동","용호2동","용호3동","용호4동","용당동","감만1동","감만2동","우암동","문현1동","문현2동","문현3동","문현4동"],
  "북구": ["구포1동","구포2동","구포3동","금곡동","화명1동","화명2동","화명3동","덕천1동","덕천2동","덕천3동","만덕1동","만덕2동","만덕3동"],
  "해운대구": ["우1동","우2동","우3동","중1동","중2동","좌1동","좌2동","좌3동","좌4동","송정동","반여1동","반여2동","반여3동","반여4동","반송1동","반송2동","재송1동","재송2동"],
  "사하구": ["괴정1동","괴정2동","괴정3동","괴정4동","당리동","하단1동","하단2동","신평1동","신평2동","장림1동","장림2동","다대1동","다대2동","구평동","감천1동","감천2동"],
  "금정구": ["서1동","서2동","서3동","금사회동동","부곡1동","부곡2동","부곡3동","부곡4동","장전1동","장전2동","선두구동","청룡노포동","남산동","구서1동","구서2동","금성동"],
  "강서구": ["대저1동","대저2동","강동동","명지1동","명지2동","가락동","녹산동","가덕도동"],
  "연제구": ["거제1동","거제2동","거제3동","거제4동","연산1동","연산2동","연산3동","연산4동","연산5동","연산6동","연산8동","연산9동"],
  "수영구": ["남천1동","남천2동","수영동","망미1동","망미2동","광안1동","광안2동","광안3동","광안4동","민락동"],
  "사상구": ["삼락동","모라1동","모라3동","덕포1동","덕포2동","괘법동","감전동","주례1동","주례2동","주례3동","학장동","엄궁동"],
  "기장군": ["기장읍","장안읍","정관읍","일광읍","철마면"]
};
const DISABILITY_TYPES = ["지체","뇌병변","시각","청각","언어","안면","신장","심장","호흡기","간","장루요루","뇌전증","지적","자폐성","정신","췌장","비장애"];
const DISABILITY_LEVELS = ["심한 장애","심하지 않은 장애"];
const INCOME_LEVELS = ["기초생활수급자","차상위계층"];
const SUPPORT_AREAS = ["주거","보건의료","돌봄","여가","정신건강","사회참여","기타"];

const guSel = document.getElementById("f-gu");
const dongSel = document.getElementById("f-dong");
Object.keys(REGIONS).forEach(gu => {
  const o = document.createElement("option");
  o.value = gu; o.textContent = gu;
  guSel.appendChild(o);
});
guSel.addEventListener("change", () => {
  dongSel.innerHTML = `<option value="">동 전체</option>`;
  (REGIONS[guSel.value] || []).forEach(dong => {
    const o = document.createElement("option");
    o.value = dong; o.textContent = dong;
    dongSel.appendChild(o);
  });
  render();
});

function buildChips(containerId, options){
  const el = document.getElementById(containerId);
  options.forEach(opt => {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = opt;
    chip.dataset.value = opt;
    chip.addEventListener("click", () => {
      chip.classList.toggle("active");
      render();
    });
    el.appendChild(chip);
  });
}
buildChips("f-area", SUPPORT_AREAS);
buildChips("f-type", DISABILITY_TYPES);
buildChips("f-level", DISABILITY_LEVELS);
buildChips("f-income", INCOME_LEVELS);

function getActiveChips(containerId){
  return [...document.querySelectorAll(`#${containerId} .chip.active`)].map(c => c.dataset.value);
}

let allServices = [];

async function loadServices(){
  const snap = await getDocs(collection(db, "services"));
  allServices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  allServices.sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko"));

  const agencySel = document.getElementById("f-agency");
  const agencies = [...new Set(allServices.map(s => s.agencyName).filter(Boolean))];
  agencies.sort((a, b) => a.localeCompare(b, "ko"));
  agencies.forEach(name => {
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    agencySel.appendChild(o);
  });

  render();
}

function matches(svc){
  const birthYear = document.getElementById("f-birthyear").value;
  const gu = guSel.value;
  const dong = dongSel.value;
  const areaSel = getActiveChips("f-area");
  const typeSel = getActiveChips("f-type");
  const levelSel = getActiveChips("f-level");
  const incomeSel = getActiveChips("f-income");
  const agency = document.getElementById("f-agency").value;

  if(agency && svc.agencyName !== agency) return false;

  // 출생연도 -> 나이로 환산, 서비스에 범위가 없으면(0~120) 전체 허용
  if(birthYear !== ""){
    const age = new Date().getFullYear() - Number(birthYear);
    const min = svc.ageMin ?? 0, max = svc.ageMax ?? 120;
    if(age < min || age > max) return false;
  }
  // 지역: 서비스 regions가 비어있으면 전체 허용
  if(svc.regions && svc.regions.length > 0){
    if(dong){
      if(!svc.regions.includes(`${gu} ${dong}`)) return false;
    } else if(gu){
      if(!svc.regions.some(r => r.startsWith(gu + " "))) return false;
    }
  }
  // 지원영역
  if(areaSel.length > 0){
    const svcA = svc.supportAreas || [];
    if(svcA.length > 0 && !areaSel.some(v => svcA.includes(v))) return false;
  }
  // 장애유형
  if(typeSel.length > 0){
    const svcT = svc.disabilityTypes || [];
    if(svcT.length > 0 && !typeSel.some(v => svcT.includes(v))) return false;
  }
  // 장애정도
  if(levelSel.length > 0){
    const svcL = svc.disabilityLevel || [];
    if(svcL.length > 0 && !levelSel.some(v => svcL.includes(v))) return false;
  }
  // 소득수준
  if(incomeSel.length > 0){
    const svcI = svc.incomeLevels || [];
    if(svcI.length > 0 && !incomeSel.some(v => svcI.includes(v))) return false;
  }
  return true;
}

function render(){
  const filtered = allServices.filter(matches);
  document.getElementById("result-count").innerHTML = `조건에 맞는 서비스 <b>${filtered.length}</b>건`;
  const area = document.getElementById("list-area");
  if(filtered.length === 0){
    area.innerHTML = `<div class="empty"><div class="big">🔍</div>조건에 맞는 서비스가 없어요<br>조건을 조정해보세요</div>`;
    return;
  }
  area.innerHTML = `<div class="cards">${filtered.map(cardHtml).join("")}</div>`;
  filtered.forEach(svc => {
    document.getElementById(`card-${svc.id}`).addEventListener("click", () => openModal(svc));
  });
}

const BADGE_PALETTE = [
  { bg:"#E4F0F7", fg:"#2E7FB0" }, // 블루
  { bg:"#E8F3EA", fg:"#3F8A55" }, // 그린
  { bg:"#F5EAF7", fg:"#8E4FA8" }, // 퍼플
  { bg:"#FCEEE0", fg:"#C97A2B" }, // 오렌지
  { bg:"#FCE8EC", fg:"#C24F6C" }, // 핑크
  { bg:"#E7F3F3", fg:"#2E8C8C" }, // 틸
  { bg:"#F2EFE3", fg:"#8A7B3F" }, // 카키
  { bg:"#EAEAF5", fg:"#5B5FA8" }, // 인디고
];
// 지원영역은 값 종류가 정해져 있어 겹치지 않도록 고정 매핑
const AREA_COLOR_MAP = {
  "주거": BADGE_PALETTE[1],
  "보건의료": BADGE_PALETTE[0],
  "돌봄": BADGE_PALETTE[7],
  "여가": BADGE_PALETTE[3],
  "정신건강": BADGE_PALETTE[4],
  "사회참여": BADGE_PALETTE[5],
  "기타": BADGE_PALETTE[6],
};
function badgeColor(text){
  if(AREA_COLOR_MAP[text]) return AREA_COLOR_MAP[text];
  let hash = 0;
  for(let i = 0; i < text.length; i++) hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
  return BADGE_PALETTE[hash % BADGE_PALETTE.length];
}

function cardHtml(svc){
  const areaBadges = (svc.supportAreas || []).map(area => {
    const c = badgeColor(area);
    return `<span class="badge" style="background:${c.bg}; color:${c.fg};">${area}</span>`;
  }).join("");
  return `
    <div class="card" id="card-${svc.id}">
      ${areaBadges}
      <h3>${svc.name || ""}</h3>
      <div class="agency">${svc.agencyName || ""}</div>
      <div class="desc">${svc.description || ""}</div>
    </div>`;
}

function openModal(svc){
  const body = document.getElementById("modal-body");
  body.innerHTML = `
    <h2>${svc.name}</h2>
    <div class="agency">${svc.agencyName}</div>
    <div class="row"><div class="k">서비스 내용</div><div class="v">${svc.description || "상세 설명이 없습니다."}</div></div>
    ${svc.partnerOrg ? `<div class="row"><div class="k">연계기관</div><div class="v">${svc.partnerOrg}</div></div>` : ""}
    <div class="row"><div class="k">대상 조건</div><div class="v">${conditionSummary(svc)}</div></div>
    <div class="row"><div class="k">문의</div><div class="v">${svc.contact || "문의처 미등록"}</div></div>
    <button class="modal-close" id="modal-close-btn">닫기</button>
  `;
  document.getElementById("modal-close-btn").addEventListener("click", closeModal);
  document.getElementById("modal-bg").classList.add("show");
}
function closeModal(){ document.getElementById("modal-bg").classList.remove("show"); }
document.getElementById("modal-bg").addEventListener("click", e => {
  if(e.target.id === "modal-bg") closeModal();
});

function conditionSummary(svc){
  const parts = [];
  if(svc.ageMin != null || svc.ageMax != null){
    parts.push(`나이 ${svc.ageMin ?? 0}~${svc.ageMax ?? 120}세`);
  }
  if(svc.supportAreas?.length) parts.push(`지원영역: ${svc.supportAreas.join(", ")}`);
  if(svc.disabilityTypes?.length) parts.push(`장애유형: ${svc.disabilityTypes.join(", ")}`);
  if(svc.disabilityLevel?.length) parts.push(`장애정도: ${svc.disabilityLevel.join(", ")}`);
  if(svc.incomeLevels?.length) parts.push(`소득수준: ${svc.incomeLevels.join(", ")}`);
  if(svc.regions?.length) parts.push(`지역: ${svc.regions.join(", ")}`);
  if(!parts.length) return "조건 무관(전체 대상)";
  return parts.map(p => `<div>${p}</div>`).join("");
}
